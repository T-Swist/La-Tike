services:
  postgres:
    image: postgres:16-alpine
    container_name: latike-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: latike
      POSTGRES_PASSWORD: latike_password
      POSTGRES_DB: latike_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U latike']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - latike-network

  redis:
    image: redis:7-alpine
    container_name: latike-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    command: redis-server --appendonly yes --requirepass latike_redis_password
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', 'latike_redis_password', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - latike-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: latike-pgadmin
    restart: unless-stopped
    ports:
      - '5051:80'
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@latike.local
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - latike-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: latike-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://latike:latike_password@postgres:5432/latike_db
      REDIS_URL: redis://:latike_redis_password@redis:6379
      JWT_SECRET: your-super-secret-jwt-key-change-this-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-key-change-this-in-production
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./server/uploads:/app/uploads
    networks:
      - latike-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:alpine
    container_name: latike-nginx
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - server
    networks:
      - latike-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  latike-network:
    driver: bridge