# La-Tike local stack
#
#   docker compose up -d                  -> postgres + pgadmin + api
#   docker compose up -d postgres pgadmin -> database only (run the API with `npm run dev`)
#   docker compose --profile prod up -d   -> also start nginx (needs nginx/ssl certs)
#
# Credentials and ports come from the root .env file (copy .env.example).

name: latike

services:
  postgres:
    image: postgres:16-alpine
    container_name: latike-postgres
    restart: unless-stopped
    ports:
      # 5433 on the host so it does not clash with other local Postgres containers
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-latike}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-latike_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-latike} -d ${POSTGRES_DB:-latike_db}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - latike-network

  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: latike-pgadmin
    restart: unless-stopped
    ports:
      - '127.0.0.1:${PGADMIN_PORT:-5051}:80'
    environment:
      # Must be a real-looking domain: newer pgAdmin rejects .local addresses
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@latike.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env}
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      # Pre-registers the La-Tike server (loaded on first start of a fresh pgadmin_data volume)
      - ./database/pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - latike-network

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: latike-server
    restart: unless-stopped
    ports:
      # Published on all interfaces so a phone on the same Wi-Fi can reach the API
      - '${API_PORT:-5000}:5000'
    env_file:
      - path: ./server/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-latike}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-latike_db}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - latike-network
    healthcheck:
      test: ['CMD', 'node', 'dist/healthcheck.js']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Not used by the API yet; start with `--profile cache` when needed.
  redis:
    image: redis:7-alpine
    container_name: latike-redis
    restart: unless-stopped
    profiles: ['cache']
    ports:
      - '127.0.0.1:${REDIS_PORT:-6381}:6379'
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-latike_redis_password}
    volumes:
      - redis_data:/data
    networks:
      - latike-network

  # Production reverse proxy; requires nginx/ssl/cert.pem and key.pem.
  nginx:
    image: nginx:alpine
    container_name: latike-nginx
    restart: unless-stopped
    profiles: ['prod']
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - server
    networks:
      - latike-network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  latike-network:
    driver: bridge
